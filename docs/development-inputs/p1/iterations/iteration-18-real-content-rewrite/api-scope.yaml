iteration: iteration-18-real-content-rewrite
task: CF-18-01A
status: frozen_cf_18_01a
runtime_stage: rewrite
subject_type: review_report
subject_id: reviewId
trigger_source: manual
input_contract: rewrite.input.v1
output_contract: rewrite.output.v1
canonical_routes:
  review_entry: /projects/{projectId}/works/{workId}/review?reportId={reviewId}
  rewrite: /projects/{projectId}/works/{workId}/rewrite
issue_selection:
  minimum: 1
  maximum: 50
  disposition: open
  ignored_selectable: false
  duplicates: rejected
  stable_order: position ASC, issueId ASC
  empty_selection: forbidden
apis:
  - operationId: getContentRewriteAvailability
    method: GET
    path: /api/v1/reviews/{reviewId}/rewrite-availability
    success: 200
    command: false
    returns: [reviewReportId, contentItemId, sourceContentVersionSummary, available, reason, openIssueCount, activeRun, configurationSummary]
  - operationId: preflightContentRewrite
    method: POST
    path: /api/v1/reviews/{reviewId}/rewrites/preflight
    success: 200
    command: false
    side_effects: none
    body: [selectedIssueIds, optionalInstructions, rewriteOptions]
    returns: [status, checks, reviewReportSnapshot, sourceContentVersionSummary, selectedIssueSummary, rewriteOptions, optionalInstructions, configurationSummary, preflightToken, expiresAt]
  - operationId: createContentRewriteRun
    method: POST
    path: /api/v1/reviews/{reviewId}/rewrites
    success: [201, 200]
    command: true
    required_headers: [Idempotency-Key]
    body: [preflightToken]
    server_fixed: {stage: rewrite, triggerSource: manual, subjectType: review_report, subjectId: reviewId}
  - operationId: getContentRewriteSummary
    method: GET
    path: /api/v1/reviews/{reviewId}/rewrite-summary
    success: 200
    command: false
    returns: [reviewReportId, contentItemId, state, canStartRewrite, activeRun, latestRun, sourceContentVersionSummary, selectedIssueSummary, candidateVersion, candidateIsCurrent, canSetCurrent, latestError, configurationSummary]
  - operationId: listContentRewriteHistory
    method: GET
    path: /api/v1/content-items/{contentItemId}/rewrite-history
    success: 200
    command: false
    query: [limit, offset]
  - operationId: getContentRewriteResult
    method: GET
    path: /api/v1/workflow-runs/{workflowRunId}/rewrite-result
    success: 200
    command: false
    returns: [reviewReportSnapshot, sourceContentVersionSummary, selectedIssueSummary, workflowRun, output, candidateVersion, candidateIsCurrent, canSetCurrent]
  - operationId: retryContentRewriteResultConsumption
    method: POST
    path: /api/v1/workflow-runs/{workflowRunId}/rewrite-result-consumption-retries
    success: 200
    command: true
    required_headers: [Idempotency-Key]
    body: [expectedRunVersion]
    external_runtime_call: false
reused_apis:
  - operationId: setCurrentContentVersion
    method: POST
    path: /api/v1/content-items/{contentItemId}/current-version
    required_headers: [Idempotency-Key]
    body: [candidateVersionId, expectedCurrentVersionId, expectedCurrentVersion]
  - operationId: getWorkflowRunDetail
    method: GET
    path: /api/v1/workflow-runs/{runId}
  - operationId: listWorkflowRunEvents
    method: GET
    path: /api/v1/workflow-runs/{runId}/events
  - operationId: retryWorkflowRun
    method: POST
    path: /api/v1/workflow-runs/{runId}/retries
    required_headers: [Idempotency-Key]
    rewrite_body_rule: expectedVersion required; useCurrentConfiguration absent or false; inputOverride forbidden
  - operationId: cancelWorkflowRun
    method: POST
    path: /api/v1/workflow-runs/{runId}/cancel
    required_headers: [Idempotency-Key]
  - operationId: getContentVersion
    method: GET
    path: /api/v1/content-versions/{versionId}
summary_states:
  - idle
  - not_configured
  - queued
  - running
  - candidate_ready
  - runtime_failed
  - output_validation_failed
  - result_consumption_failed
runtime_retry:
  allowed: [failed, cancelled, output_validation_failed]
  forbidden: [result_consumption_failed]
  inherits: [sourceContentVersion, reviewReport, selectedIssues, bindingSnapshot, configurationSnapshot, connectionSnapshot]
  input_override: forbidden
  success: [201, 200]
result_consumption_retry:
  allowed: [succeeded_with_result_consumption_failed]
  creates_run: false
  calls_runtime: false
  reuses_persisted_output: true
  success: 200
set_current:
  candidate_already_current: 200
  cas_conflict: {http: 409, code: content_version_conflict}
  idempotent_replay: 200
error_codes:
  review_not_found: [404]
  review_issue_not_found: [404]
  rewrite_not_available: [422]
  rewrite_not_configured: [422]
  rewrite_preflight_expired: [422]
  rewrite_preflight_stale: [409]
  rewrite_preflight_consumed: [409]
  active_rewrite_run_conflict: [409]
  rewrite_candidate_not_found: [404]
  rewrite_candidate_not_ready: [409]
  rewrite_output_validation_failed: [422, 409]
  rewrite_result_consumption_failed: [500]
  content_version_conflict: [409]
  idempotency_conflict: [409]
  workflow_run_not_found: [404]
  workflow_run_version_conflict: [409]
  internal_error: [500]
common_requirements:
  - OpenAPI is the single HTTP contract source.
  - Every operation has one canonical path; no parallel rewrite API exists.
  - Empty Issue selection is forbidden; only 1-50 open Issues from the bound ReviewReport are legal.
  - The service builds rewrite.input.v1 from protected persisted facts.
  - rewrite.output.v1 is strict and trailing JSON, unknown fields, forbidden internal fields and duplicate Issue references are rejected.
  - Runtime succeeded without an atomically persisted same-Run Candidate is not candidate_ready.
  - Set Current leaves Summary candidate_ready and returns candidateIsCurrent=true plus canSetCurrent=false.
  - Result consumption retry never calls Runtime or n8n and never creates a new Run.
  - Secrets, tokens, cookies, webhooks, database information, raw upstream responses, SQL, stacks, internal nodes and internal URLs are never returned.
excluded:
  - automatic set-current
  - automatic review, rewrite loop or publish
  - mutation of source ReviewReport or ReviewIssue disposition
  - temporary workflow selection
  - visual workflow editor or multi-instance routing
  - data-model, transaction, lock, index or Migration decisions reserved for CF-18-01B
