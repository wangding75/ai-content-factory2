iteration: iteration-17-real-content-review
status: frozen_cf_17_01
runtime_stage: review
subject_type: content_version
trigger_source: manual
input_contract: review.input.v1
output_contract: review.output.v1
canonical_routes:
  editor: /projects/{projectId}/works/{workId}
  review: /projects/{projectId}/works/{workId}/review
  history: /projects/{projectId}/works/{workId}/review/history
apis:
  - operationId: preflightContentReviewRun
    method: POST
    path: /api/v1/content-versions/{contentVersionId}/review-runs/preflight
    success: 200
    command: false
    side_effects: none
    body: [sourceContentVersionVersion, optionalInstructions]
    returns: [status, checks, sourceContentVersionSummary, reviewDimensions, configurationSummary, preflightToken, expiresAt]
  - operationId: createContentReviewRun
    method: POST
    path: /api/v1/content-versions/{contentVersionId}/review-runs
    success: [201, 200]
    command: true
    required_headers: [Idempotency-Key]
    body: [preflightToken]
    server_fixed: {stage: review, triggerSource: manual, subjectType: content_version, subjectId: contentVersionId}
  - operationId: getContentReviewSummary
    method: GET
    path: /api/v1/content-items/{contentItemId}/review-summary
    success: 200
    returns: [state, canStartReview, activeRun, latestRun, latestReport, issueSummary, latestError, configurationSummary]
  - operationId: listContentItemReviews
    method: GET
    path: /api/v1/content-items/{contentItemId}/reviews
    success: 200
    reuse: p0
    sort: created_at DESC, id DESC
    includes: [workflowRun, sourceContentVersionSummary, reportSummary, state, latestError]
  - operationId: getReview
    method: GET
    path: /api/v1/reviews/{reviewId}
    success: 200
    reuse: p0
    includes: [report, sourceContentVersionSummary, issues, recommendations, workflowRunSummary]
  - operationId: updateReviewIssue
    method: PATCH
    path: /api/v1/reviews/{reviewId}/issues/{issueId}
    success: 200
    command: true
    required_headers: [Idempotency-Key]
    body: [disposition, expectedVersion]
    allowed_disposition: [open, ignored]
  - operationId: retryReviewResultConsumption
    method: POST
    path: /api/v1/workflow-runs/{workflowRunId}/review-result-consumption-retries
    success: 200
    command: true
    required_headers: [Idempotency-Key]
    body: [expectedRunVersion]
    external_runtime_call: false
reused_workflow_run_apis:
  - getWorkflowRunDetail
  - listWorkflowRunEvents
  - retryWorkflowRun
  - cancelWorkflowRun
summary_states:
  - idle
  - not_configured
  - queued
  - running
  - review_ready
  - runtime_failed
  - output_validation_failed
  - result_consumption_failed
common_requirements:
  - OpenAPI is the single HTTP contract source after CF-17-01
  - all commands use persistent Idempotency-Key semantics
  - errors use the shared ErrorEnvelope shape with review-specific safe codes
  - source version, project ownership and optimistic locks are checked server-side
  - secrets, raw upstream responses, SQL, stacks, internal nodes and internal URLs are never returned
  - business pages cannot override stage, subject, workflow binding, configuration or connection snapshots
  - succeeded without a same-Run ReviewReport is not review_ready
  - review resources and optimistic-lock failures use content_version_not_found, review_not_found, review_issue_not_found, workflow_run_not_found, review_issue_version_conflict, and workflow_run_version_conflict precisely
excluded:
  - Iteration 18 rewrite-run APIs
  - temporary workflow selection in review drawer
  - parallel Review Stage
  - changes to P0 Mock Review API semantics
